name: Publish

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - src/**
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The registry, not a git tag, says whether the version is out: 0.10.0 and 0.11.0 were published without a tag,
      # so the tag check let a docs-only push to main try to publish 0.11.0 again (npm refused). Every later step is
      # skipped when the version is already published — a step's `exit 0` never stopped the job.
      - name: Check if version is already published
        id: published
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION="${{ steps.package.outputs.version }}"

          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$PKG@$VERSION is already on npm — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$PKG@$VERSION is not on npm — publishing."
          fi

      - name: Setup Node.js
        if: steps.published.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm
        if: steps.published.outputs.exists == 'false'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.published.outputs.exists == 'false'
        run: npm ci

      - name: Build
        if: steps.published.outputs.exists == 'false'
        run: npm run build

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public

      - name: Create git tag
        if: steps.published.outputs.exists == 'false'
        run: |
          TAG="${{ steps.package.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        if: steps.published.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.tag }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
